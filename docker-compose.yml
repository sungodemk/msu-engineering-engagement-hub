services:
  db:
    image: postgres:17
    container_name: engagement-hub-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: engagement
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d engagement"]
      interval: 5s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate
    container_name: engagement-hub-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:dev@db:5432/engagement?sslmode=disable}
    volumes:
      - ./backend/db/migrations:/db/migrations
    command: --migrations-dir /db/migrations --no-dump-schema up
  seed:
    container_name: engagement-hub-seed
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:dev@db:5432/engagement?sslmode=disable}
      PYTHONUNBUFFERED: '1'
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: sh -c "python scripts/load_fixtures.py && python scripts/load_kuali.py && python scripts/load_handshake.py && python scripts/load_spreadsheets.py && python scripts/entity_edits.py && python scripts/company_matcher.py && python scripts/person_matcher.py"
  # A name for this container
  flask-app:
    container_name: engagement-hub
    build:
      context: ./backend
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:dev@db:5432/engagement?sslmode=disable}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  react-app:
    container_name: engagement-hub-frontend
    build:
      context: ./frontend
    stdin_open: true
    tty: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:


