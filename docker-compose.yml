services:
  # A name for this container
  flask-app:
    container_name: engagement-hub
    build:
      context: ./backend
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:dev@host.docker.internal:5432/postgres"
    volumes:
      - ./backend:/app

  react-app:
    container_name: engagement-hub-frontend
    build:
      context: ./frontend
    stdin_open: true
    tty: true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules